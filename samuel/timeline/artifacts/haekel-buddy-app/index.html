<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Häkel-Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ THEME — Paper/Ink + Craft ============ */
  :root {
    --font-body: 'Fraunces', Georgia, serif;
    --font-mono: 'Source Code Pro', 'SF Mono', Consolas, monospace;

    --bg: #faf7f2;
    --surface: #ffffff;
    --surface2: #f3ede4;
    --surface-elevated: #fffcf7;
    --border: rgba(90, 60, 30, 0.1);
    --border-bright: rgba(90, 60, 30, 0.2);
    --text: #2c2520;
    --text-dim: #8a7b6e;

    --terracotta: #b85c38;
    --terracotta-dim: rgba(184, 92, 56, 0.08);
    --sage: #5a7a3a;
    --sage-dim: rgba(90, 122, 58, 0.08);
    --rose: #c44569;
    --rose-dim: rgba(196, 69, 105, 0.08);
    --yarn: #d4a574;
    --yarn-dim: rgba(212, 165, 116, 0.12);
    --plum: #6b3a6b;
    --plum-dim: rgba(107, 58, 107, 0.08);
    --sky: #3a6b8c;
    --sky-dim: rgba(58, 107, 140, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1714;
      --surface: #242019;
      --surface2: #2e2922;
      --surface-elevated: #322c24;
      --border: rgba(255, 220, 180, 0.08);
      --border-bright: rgba(255, 220, 180, 0.15);
      --text: #ede4d8;
      --text-dim: #a09080;

      --terracotta: #e8845a;
      --terracotta-dim: rgba(232, 132, 90, 0.12);
      --sage: #8cb85c;
      --sage-dim: rgba(140, 184, 92, 0.1);
      --rose: #e8687a;
      --rose-dim: rgba(232, 104, 122, 0.12);
      --yarn: #d4a574;
      --yarn-dim: rgba(212, 165, 116, 0.1);
      --plum: #b880b8;
      --plum-dim: rgba(184, 128, 184, 0.1);
      --sky: #6aafdb;
      --sky-dim: rgba(106, 175, 219, 0.1);
    }
  }

  /* ============ RESET ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 15% 5%, var(--rose-dim) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, var(--sage-dim) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, var(--yarn-dim) 0%, transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100dvh;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes progressGrow {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  /* ============ VIEWS ============ */
  .view {
    display: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .view.active {
    display: block;
    animation: fadeUp 0.35s ease-out forwards;
  }

  /* ============ SELECTOR VIEW ============ */
  .selector-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .app-header {
    margin-bottom: 28px;
  }
  .app-title {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: 0;
    line-height: 1.15;
    font-variation-settings: 'opsz' 144;
  }
  .app-title span { color: var(--rose); }
  .app-subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* ============ FILTER PILLS ============ */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .filter-pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--font-mono);
    font-weight: 600;
    border: 1.5px solid var(--border-bright);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .filter-pill:hover {
    border-color: var(--rose);
    color: var(--rose);
    background: var(--rose-dim);
  }
  .filter-pill.active {
    background: var(--rose);
    color: white;
    border-color: var(--rose);
  }

  /* ============ PATTERN GRID ============ */
  .pattern-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .pattern-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    animation: fadeScale 0.35s ease-out both;
    animation-delay: calc(var(--i, 0) * 0.05s);
  }
  .pattern-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--rose-dim);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .pattern-card:hover {
    border-color: var(--rose);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  .pattern-card:hover::before { opacity: 1; }
  .pattern-card:active { transform: translateY(0); }

  .card-emoji {
    font-size: 36px;
    line-height: 1;
    margin-bottom: 12px;
    display: block;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    font-variation-settings: 'opsz' 48;
    position: relative;
  }
  .card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .card-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card-tag--category {
    background: var(--terracotta-dim);
    color: var(--terracotta);
  }
  .card-tag--difficulty {
    background: var(--yarn-dim);
    color: #7a5c30;
  }
  @media (prefers-color-scheme: dark) {
    .card-tag--difficulty { color: var(--yarn); }
  }
  .card-tag--time {
    background: var(--sky-dim);
    color: var(--sky);
  }

  .card-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    position: relative;
  }
  .card-progress-bar {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }
  .card-progress-fill {
    height: 100%;
    background: var(--sage);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .card-progress-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--sage);
    font-weight: 600;
    white-space: nowrap;
  }
  .card-progress--done .card-progress-label { color: var(--text-dim); }
  .card-progress--done .card-progress-fill { background: var(--text-dim); }

  .card-done-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--sage);
    color: white;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  /* ============ PATTERN VIEW ============ */
  .pattern-view {
    max-width: 680px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* sticky top progress */
  .pattern-topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .pattern-topbar-inner {
    max-width: 680px;
    margin: 0 auto;
  }
  .topbar-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1.5px solid var(--border-bright);
    border-radius: 8px;
    padding: 5px 12px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .back-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
    background: var(--surface2);
  }
  .topbar-progress-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    text-align: right;
  }
  .topbar-progress-label strong {
    color: var(--sage);
    font-weight: 700;
  }
  .topbar-progress-bar {
    height: 5px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .topbar-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--terracotta));
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* pattern header */
  .pattern-header {
    padding: 24px 20px 20px;
  }
  .pattern-emoji-title {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .pattern-emoji-big {
    font-size: 48px;
    line-height: 1;
  }
  .pattern-title-block {}
  .pattern-title {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 800;
    letter-spacing: 0;
    font-variation-settings: 'opsz' 72;
  }
  .pattern-subtitle {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }

  .pattern-info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .info-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .info-chip strong { color: var(--text); font-weight: 600; }

  .materials-box {
    background: var(--yarn-dim);
    border: 1px solid rgba(212, 165, 116, 0.25);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .materials-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--terracotta);
    margin-bottom: 8px;
  }
  .materials-list {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .materials-list li {
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    padding: 3px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
  }

  /* ============ STEPS LIST ============ */
  .steps-list {
    padding: 0 20px;
  }
  .step-item {
    display: flex;
    gap: 14px;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1.5px solid transparent;
    transition: all 0.2s;
    cursor: default;
  }
  .step-item--done {
    background: var(--sage-dim);
    border-color: rgba(90, 122, 58, 0.15);
  }
  .step-item--active {
    background: var(--rose-dim);
    border-color: var(--rose);
    box-shadow: 0 2px 12px rgba(196, 69, 105, 0.1);
  }
  .step-item--upcoming {
    opacity: 0.45;
  }

  .step-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border-bright);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-top: 1px;
    transition: all 0.2s;
  }
  .step-item--done .step-check {
    background: var(--sage);
    border-color: var(--sage);
    color: white;
  }
  .step-item--active .step-check {
    border-color: var(--rose);
    background: var(--rose-dim);
    color: var(--rose);
  }
  .step-item--upcoming .step-check {
    color: transparent;
  }

  .step-content { flex: 1; min-width: 0; }
  .step-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .step-item--done .step-label { color: var(--sage); }
  .step-item--active .step-label { color: var(--rose); }
  .step-item--upcoming .step-label { color: var(--text-dim); }

  .step-number {
    margin-right: 6px;
    opacity: 0.6;
  }
  .step-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    font-variation-settings: 'opsz' 36;
  }
  .step-instruction {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 6px;
  }
  .step-notation {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--yarn-dim);
    color: var(--terracotta);
    padding: 3px 9px;
    border-radius: 5px;
    display: inline-block;
    margin-top: 4px;
    margin-bottom: 4px;
  }
  .step-count {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--sky-dim);
    color: var(--sky);
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-left: 6px;
    margin-top: 4px;
  }
  .step-tip {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    background: var(--surface2);
    border-left: 3px solid var(--yarn);
    border-radius: 0 6px 6px 0;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .step-tip-icon {
    flex-shrink: 0;
    font-size: 14px;
    margin-top: 1px;
  }

  /* ============ STICKY BOTTOM ============ */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 12px 20px 20px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    display: none;
  }
  .bottom-bar.visible { display: block; }
  .bottom-bar-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  .btn-primary {
    flex: 1;
    background: var(--rose);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-variation-settings: 'opsz' 36;
    letter-spacing: 0;
  }
  .btn-primary:hover {
    background: var(--terracotta);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(196, 69, 105, 0.3);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text-dim);
    border: 1.5px solid var(--border-bright);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-secondary:hover {
    border-color: var(--text-dim);
    color: var(--text);
    background: var(--surface2);
  }
  .btn-secondary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ============ COMPLETION VIEW ============ */
  .completion-wrap {
    max-width: 500px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
    animation: fadeUp 0.45s ease-out both;
  }
  .completion-emoji {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 20px;
    display: block;
  }
  .completion-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 0;
    margin-bottom: 12px;
    font-variation-settings: 'opsz' 144;
  }
  .completion-title span { color: var(--rose); }
  .completion-text {
    font-size: 17px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }
  .completion-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 320px;
    margin: 0 auto;
  }
  .btn-completion-primary {
    background: var(--sage);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px 24px;
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-variation-settings: 'opsz' 36;
  }
  .btn-completion-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(90, 122, 58, 0.25);
  }
  .btn-completion-secondary {
    background: var(--surface);
    color: var(--text-dim);
    border: 1.5px solid var(--border-bright);
    border-radius: 12px;
    padding: 14px 24px;
    font-family: var(--font-body);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-completion-secondary:hover {
    color: var(--text);
    border-color: var(--text-dim);
    background: var(--surface2);
  }
  .completion-confetti {
    font-size: 32px;
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    animation: fadeScale 0.5s ease-out 0.2s both;
  }

  /* ============ STITCH TOOLTIP ============ */
  code[title] {
    cursor: help;
    text-decoration: underline dotted var(--terracotta);
    text-underline-offset: 2px;
  }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .empty-state-icon {
    font-size: 40px;
    margin-bottom: 16px;
    display: block;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 480px) {
    .selector-wrap { padding: 20px 16px 100px; }
    .pattern-grid { grid-template-columns: 1fr 1fr; }
    .pattern-topbar { padding: 10px 16px; }
    .pattern-header { padding: 16px 16px 14px; }
    .steps-list { padding: 0 12px; }
    .bottom-bar { padding: 10px 16px 18px; }
    .step-item { padding: 12px; }
    .pattern-emoji-big { font-size: 36px; }
  }
  @media (max-width: 360px) {
    .pattern-grid { grid-template-columns: 1fr; }
  }

  /* ============ SVG ENHANCEMENTS ============ */
  .card-svg {
    width: 80px;
    height: 80px;
    margin: 0 auto 0.5rem;
  }
  .card-svg svg {
    width: 100%;
    height: 100%;
  }
  .pattern-svg-big {
    width: 120px;
    height: 120px;
    margin: 0 auto 1rem;
  }
  .pattern-svg-big svg {
    width: 100%;
    height: 100%;
  }
  .step-illustration {
    width: 140px;
    height: 105px;
    margin: 0.5rem auto;
    opacity: 0.85;
  }
  .step-illustration svg {
    width: 100%;
    height: 100%;
  }
  .stitch-legend {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin: 1rem 0;
    display: none;
  }
  .stitch-legend.open {
    display: block;
  }
  .stitch-legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.75rem;
  }
  .stitch-legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .stitch-legend-item svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .stitch-legend-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    margin: 0.5rem 0;
  }
  .stitch-legend-toggle:hover {
    background: var(--border);
  }
  .pattern-description {
    text-align: center;
    margin: 0.5rem 0 1rem;
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.5;
  }

// ============ STEP SVG CHART GENERATOR ============
// Parses the notation string of a step and returns an SVG string showing stitch symbols.
// Falls back to technique illustrations when notation is null.

function generateStepSVG(step, patternId, stepIndex) {
  // ---- Symbol draw helpers (return SVG element strings) ----

  // fM — Feste Masche — Plus-Kreuz
  function symFM(cx, cy, r) {
    r = r || 8;
    return `<line x1="${cx}" y1="${cy - r}" x2="${cx}" y2="${cy + r}" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx - r}" y1="${cy}" x2="${cx + r}" y2="${cy}" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // Stb — Staebchen — T-Form
  function symStb(cx, cy) {
    return `<line x1="${cx}" y1="${cy - 10}" x2="${cx}" y2="${cy + 8}" stroke="var(--terracotta)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx - 7}" y1="${cy - 10}" x2="${cx + 7}" y2="${cy - 10}" stroke="var(--terracotta)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // hStb — Halbes Staebchen — kleineres T
  function symHStb(cx, cy) {
    return `<line x1="${cx}" y1="${cy - 7}" x2="${cx}" y2="${cy + 7}" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx - 5}" y1="${cy - 7}" x2="${cx + 5}" y2="${cy - 7}" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // dStb — Doppelstaebchen — T mit Doppel-Schrägstrich
  function symDStb(cx, cy) {
    return `<line x1="${cx}" y1="${cy - 12}" x2="${cx}" y2="${cy + 8}" stroke="var(--plum)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx - 7}" y1="${cy - 12}" x2="${cx + 7}" y2="${cy - 12}" stroke="var(--plum)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 4}" y2="${cy - 9}" stroke="var(--plum)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>` +
           `<line x1="${cx - 4}" y1="${cy}" x2="${cx + 4}" y2="${cy - 4}" stroke="var(--plum)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>`;
  }

  // Lm — Luftmasche — Oval
  function symLm(cx, cy) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="6" ry="4" fill="none" stroke="var(--yarn)" stroke-width="2"/>`;
  }

  // Km — Kettmasche — gefüllter Punkt
  function symKm(cx, cy) {
    return `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--text-dim)"/>`;
  }

  // Zun — Zunahme — V-Form
  function symZun(cx, cy) {
    return `<line x1="${cx}" y1="${cy + 8}" x2="${cx - 7}" y2="${cy - 8}" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx}" y1="${cy + 8}" x2="${cx + 7}" y2="${cy - 8}" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // Abn — Abnahme — Λ-Form (umgekehrtes V)
  function symAbn(cx, cy) {
    return `<line x1="${cx - 7}" y1="${cy + 8}" x2="${cx}" y2="${cy - 8}" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>` +
           `<line x1="${cx + 7}" y1="${cy + 8}" x2="${cx}" y2="${cy - 8}" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>`;
  }

  // MR — Magic Ring — Kreis mit Pfeil
  function symMR(cx, cy) {
    return `<circle cx="${cx}" cy="${cy}" r="8" fill="none" stroke="var(--terracotta)" stroke-width="2" stroke-dasharray="4 2"/>` +
           `<polyline points="${cx - 2},${cy - 12} ${cx + 2},${cy - 8} ${cx - 2},${cy - 4}" fill="none" stroke="var(--terracotta)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  // Ellipsis dots
  function symEllipsis(cx, cy) {
    return `<circle cx="${cx - 4}" cy="${cy}" r="1.5" fill="var(--text-dim)"/>` +
           `<circle cx="${cx}" cy="${cy}" r="1.5" fill="var(--text-dim)"/>` +
           `<circle cx="${cx + 4}" cy="${cy}" r="1.5" fill="var(--text-dim)"/>`;
  }

  // ---- Token type → draw function ----
  const SYMBOL_MAP = {
    'fM':   symFM,
    'Stb':  symStb,
    'hStb': symHStb,
    'dStb': symDStb,
    'Lm':   symLm,
    'Km':   symKm,
    'Zun':  symZun,
    'Abn':  symAbn,
    'MR':   (cx, cy) => symMR(cx, cy),
  };

  // ---- Parse notation into a flat list of {type, count} tokens ----
  // Returns array like [{type:'MR',count:1},{type:'fM',count:6},...]
  function parseNotation(notation) {
    if (!notation) return [];
    const tokens = [];
    const n = notation.trim();

    // Handle "MR" standalone
    if (n === 'MR') { tokens.push({type:'MR', count:1}); return tokens; }

    // Pattern with repeat: "*...*  ×N" or "*...* xN" — extract inner tokens, max 3-4 reps shown
    const repeatMatch = n.match(/\*([^*]+)\*\s*[×x]\s*(\d+)/);
    if (repeatMatch) {
      const inner = repeatMatch[1].trim();
      const totalReps = parseInt(repeatMatch[2], 10);
      const showReps = Math.min(totalReps, 3);
      // Parse inner once and repeat showReps times
      const innerTokens = parseSimple(inner);
      for (let r = 0; r < showReps; r++) {
        tokens.push(...innerTokens);
      }
      if (totalReps > showReps) {
        tokens.push({type:'...', count:1});
      }
      return tokens;
    }

    // Simple notation: possibly comma-separated segments
    return parseSimple(n);
  }

  function parseSimple(text) {
    // Split by comma, parse each segment
    const result = [];
    const parts = text.split(',');
    for (const part of parts) {
      const p = part.trim();
      if (!p) continue;
      // Match: optional count + stitch type + optional "pro Runde" etc.
      // Order matters: longer abbreviations first
      const stitchTypes = ['hStb','dStb','fM','Stb','Lm','Km','Zun','Abn','MR','WLm'];
      let matched = false;
      for (const st of stitchTypes) {
        // e.g. "6 fM" or "12 Stb" or "fM" or "MR" or "2 WLm + 46 hStb"
        const re = new RegExp('(\\d+)?\\s*' + st.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s|$|,|\\+|×|x)', 'g');
        let m;
        while ((m = re.exec(p)) !== null) {
          const count = m[1] ? parseInt(m[1], 10) : 1;
          // Skip WLm (Wendeluftmasche) — render as Lm
          const type = st === 'WLm' ? 'Lm' : st;
          result.push({type, count});
          matched = true;
        }
      }
      // If nothing matched but has MR standalone
      if (!matched && p.includes('MR')) {
        result.push({type:'MR', count:1});
      }
    }
    return result;
  }

  // ---- Build symbol list respecting max-display rule ----
  // Expand tokens to flat symbol array, apply truncation if >12
  function buildSymbolList(tokens) {
    const flat = [];
    for (const tok of tokens) {
      if (tok.type === '...') {
        flat.push('...');
        continue;
      }
      const count = Math.max(1, tok.count);
      for (let i = 0; i < count; i++) {
        flat.push(tok.type);
      }
    }

    const MAX_SHOW = 12;
    if (flat.length > MAX_SHOW) {
      // Show first 6, ellipsis, last 2
      const head = flat.slice(0, 6);
      const tail = flat.slice(-2);
      return [...head, '...', ...tail];
    }
    return flat;
  }

  // ---- Technique illustrations for steps without notation ----
  function getTechniqueIllustration(step) {
    const title = (step.title || '').toLowerCase();
    const instr = (step.instruction || '').toLowerCase();
    const combined = title + ' ' + instr;

    if (combined.includes('magic ring') || combined.includes('fadenring') || combined.includes('mr')) {
      // Magic Ring illustration — central ring with radiating stitches
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">MR</text>
        <circle cx="40" cy="32" r="18" fill="none" stroke="var(--terracotta)" stroke-width="2.5" stroke-dasharray="5 3"/>
        <circle cx="40" cy="32" r="6" fill="none" stroke="var(--terracotta)" stroke-width="1.5"/>
        <polyline points="38,12 40,8 42,12" fill="none" stroke="var(--terracotta)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="58" y1="32" x2="52" y2="32" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="58" y1="32" x2="60" y2="32" stroke="var(--sage)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="66" y1="20" x2="76" y2="20" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="71" y1="16" x2="71" y2="24" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="86" y1="32" x2="96" y2="32" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="91" y1="28" x2="91" y2="36" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="66" y1="44" x2="76" y2="44" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <line x1="71" y1="40" x2="71" y2="48" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
        <text x="58" y="56" font-size="6.5" font-family="monospace" fill="var(--text-dim)">6 fM in Ring</text>
      </svg>`;
    }

    if (combined.includes('spirale') || combined.includes('rollen')) {
      // Spiral roll
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Rollen</text>
        <path d="M60 30 A20 20 0 1 1 39 30" fill="none" stroke="var(--rose)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
        <path d="M60 30 A13 13 0 1 1 46 30" fill="none" stroke="var(--terracotta)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
        <path d="M60 30 A7 7 0 1 1 52 30" fill="none" stroke="var(--yarn)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <circle cx="60" cy="30" r="3" fill="var(--terracotta)"/>
        <polyline points="95,22 90,30 98,30" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        <line x1="80" y1="46" x2="110" y2="46" stroke="var(--rose)" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
        <line x1="80" y1="46" x2="110" y2="46" stroke="var(--rose)" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      </svg>`;
    }

    if (combined.includes('verbinden') || combined.includes('haelften') || combined.includes('zusammen')) {
      // Join halves
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Verbinden</text>
        <path d="M30 50 C30 50 12 36 12 24 C12 16 18 12 26 12 C32 12 37 16 40 21 Z" fill="var(--rose-dim)" stroke="var(--rose)" stroke-width="2"/>
        <path d="M50 50 C50 50 68 36 68 24 C68 16 62 12 54 12 C48 12 43 16 40 21 Z" fill="var(--rose-dim)" stroke="var(--rose)" stroke-width="2"/>
        <line x1="40" y1="21" x2="40" y2="50" stroke="var(--terracotta)" stroke-width="1.5" stroke-dasharray="3 2" stroke-linecap="round"/>
        <line x1="85" y1="20" x2="85" y2="50" stroke="var(--text-dim)" stroke-width="2.5" stroke-linecap="round"/>
        <polyline points="78,25 85,18 92,25" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="78" y1="30" x2="92" y2="30" stroke="var(--yarn)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="78" y1="38" x2="92" y2="38" stroke="var(--yarn)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="78" y1="46" x2="92" y2="46" stroke="var(--yarn)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </svg>`;
    }

    if (combined.includes('material') || combined.includes('bereitlegen')) {
      // Materials — yarn ball + needle
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="38" cy="32" r="20" fill="var(--yarn-dim)" stroke="var(--yarn)" stroke-width="2"/>
        <path d="M22 22 Q38 16 54 32" fill="none" stroke="var(--yarn)" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 36 Q38 28 50 36" fill="none" stroke="var(--yarn)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <path d="M26 44 Q38 38 48 44" fill="none" stroke="var(--yarn)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        <line x1="72" y1="12" x2="95" y2="48" stroke="var(--text-dim)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="72" cy="12" r="4" fill="var(--surface2)" stroke="var(--text-dim)" stroke-width="2"/>
        <ellipse cx="95" cy="49" rx="3" ry="5" fill="var(--text-dim)" transform="rotate(30 95 49)"/>
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Material</text>
      </svg>`;
    }

    if (combined.includes('farbwechsel') || combined.includes('farbe wechsel') || combined.includes('neue farbe')) {
      // Color change — two colored blocks with arrow
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="18" width="42" height="28" rx="5" fill="var(--sky-dim)" stroke="var(--sky)" stroke-width="2"/>
        <rect x="70" y="18" width="42" height="28" rx="5" fill="var(--terracotta-dim)" stroke="var(--terracotta)" stroke-width="2"/>
        <polyline points="50,32 70,32" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round"/>
        <polyline points="62,26 70,32 62,38" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Farbwechsel</text>
      </svg>`;
    }

    if (combined.includes('fertig') || combined.includes('abschluss') || combined.includes('vernaehen')) {
      // Scissors + thread
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <line x1="20" y1="20" x2="70" y2="45" stroke="var(--yarn)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="20" x2="25" y2="12" stroke="var(--yarn)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <circle cx="72" cy="22" r="8" fill="none" stroke="var(--text-dim)" stroke-width="2.5"/>
        <circle cx="86" cy="38" r="8" fill="none" stroke="var(--text-dim)" stroke-width="2.5"/>
        <line x1="68" y1="28" x2="82" y2="44" stroke="var(--text-dim)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="76" y1="16" x2="90" y2="44" stroke="var(--text-dim)" stroke-width="2.5" stroke-linecap="round"/>
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Fertig</text>
      </svg>`;
    }

    if (combined.includes('stopfen') || combined.includes('fuellwatte') || combined.includes('fuellen')) {
      // Stuffing illustration — ball shape with fill arrows
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="32" r="22" fill="var(--yarn-dim)" stroke="var(--yarn)" stroke-width="2"/>
        <line x1="60" y1="10" x2="60" y2="18" stroke="var(--terracotta)" stroke-width="2" stroke-linecap="round"/>
        <polyline points="55,16 60,22 65,16" fill="none" stroke="var(--terracotta)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="52" cy="30" r="4" fill="var(--surface)" opacity="0.6"/>
        <circle cx="66" cy="28" r="5" fill="var(--surface)" opacity="0.5"/>
        <circle cx="58" cy="40" r="4" fill="var(--surface)" opacity="0.5"/>
        <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Stopfen</text>
      </svg>`;
    }

    // Generic crochet icon — hook with yarn
    return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 48 L30 18 Q30 10 38 10 Q46 10 46 18 Q46 24 38 24" fill="none" stroke="var(--text-dim)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="60" cy="34" r="18" fill="none" stroke="var(--yarn)" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M50 28 Q60 22 70 28 Q78 34 70 42" fill="none" stroke="var(--yarn)" stroke-width="2" stroke-linecap="round"/>
      <text x="4" y="10" font-size="7" font-family="monospace" fill="var(--text-dim)" font-weight="600">Haekeln</text>
    </svg>`;
  }

  // ---- Main logic ----
  if (!step.notation) {
    return getTechniqueIllustration(step);
  }

  const tokens = parseNotation(step.notation);
  if (tokens.length === 0) {
    return getTechniqueIllustration(step);
  }

  const symbols = buildSymbolList(tokens);
  if (symbols.length === 0) {
    return getTechniqueIllustration(step);
  }

  // ---- Layout: linear row of symbols ----
  const SYMBOL_SIZE = 20;   // space allocated per symbol (px)
  const PADDING_LEFT = 10;
  const CY = 30;             // vertical center in 60-high viewbox

  const totalW = PADDING_LEFT * 2 + symbols.length * SYMBOL_SIZE;
  // Minimum width 80, no max (SVG scales)
  const vbW = Math.max(80, totalW);

  let innerSVG = '';
  symbols.forEach((sym, idx) => {
    const cx = PADDING_LEFT + idx * SYMBOL_SIZE + SYMBOL_SIZE / 2;
    const cy = CY;
    if (sym === '...') {
      innerSVG += symEllipsis(cx, cy);
    } else if (SYMBOL_MAP[sym]) {

// ============ STATE ============
let currentPatternId = null;
let currentStep = 0;
const STORAGE_KEY = 'haekel-buddy-progress';

function loadAllProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveProgress(patternId, step) {
  const all = loadAllProgress();
  all[patternId] = step;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}

function loadProgress(patternId) {
  return loadAllProgress()[patternId] || 0;
}

// ============ VIEWS ============
function showView(id) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const el = document.getElementById('view-' + id);
  el.style.display = 'block';
  requestAnimationFrame(() => el.classList.add('active'));
}

// ============ SELECTOR ============
let activeFilter = 'Alle';

function getCategories() {
  const cats = ['Alle', ...new Set(PATTERNS.map(p => p.category))];
  return cats;
}

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-pill' + (cat === activeFilter ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      renderFilterBar();
      renderGrid();
    };
    bar.appendChild(btn);
  });
}

function renderGrid() {
  const grid = document.getElementById('pattern-grid');
  const allProgress = loadAllProgress();
  const filtered = activeFilter === 'Alle'
    ? PATTERNS
    : PATTERNS.filter(p => p.category === activeFilter);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">🧶</span>Keine Muster in dieser Kategorie</div>';
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const progress = allProgress[p.id] || 0;
    const total = p.steps.length;
    const done = progress >= total;
    const started = progress > 0;
    const pct = Math.round((progress / total) * 100);

    let progressHtml = '';
    if (started) {
      progressHtml = `
        <div class="card-progress${done ? ' card-progress--done' : ''}">
          <div class="card-progress-bar">
            <div class="card-progress-fill" style="width:${pct}%"></div>
          </div>
          <span class="card-progress-label">${done ? 'Fertig!' : progress + '/' + total}</span>
        </div>`;
    }

    const doneBadge = done ? '<span class="card-done-badge">✓</span>' : '';

    const svgKey = PATTERN_SVG_MAP[p.id];
    const svgPreview = svgKey && HAEKEL_SVGS.productPreviews[svgKey]
      ? `<div class="card-svg">${HAEKEL_SVGS.productPreviews[svgKey]}</div>`
      : `<span class="card-emoji">${p.image}</span>`;

    return `<div class="pattern-card" style="--i:${i}" onclick="openPattern('${p.id}')">
      ${doneBadge}
      ${svgPreview}
      <div class="card-title">${p.title}</div>
      <div class="card-meta">
        <span class="card-tag card-tag--category">${p.category}</span>
        <span class="card-tag card-tag--difficulty">${p.difficulty}</span>
        <span class="card-tag card-tag--time">⏱ ${p.time}</span>
      </div>
      ${progressHtml}
    </div>`;
  }).join('');
}

function renderSelector() {
  renderFilterBar();
  renderGrid();
}

function showSelector() {
  renderSelector();
  showView('selector');
  document.getElementById('bottom-bar').classList.remove('visible');
}

// ============ PATTERN VIEW ============
function openPattern(patternId) {
  currentPatternId = patternId;
  currentStep = loadProgress(patternId);
  const pattern = PATTERNS.find(p => p.id === patternId);
  if (!pattern) return;

  // Check if already done
  if (currentStep >= pattern.steps.length) {
    renderCompletion(pattern);
    showView('completion');
    document.getElementById('bottom-bar').classList.remove('visible');
    return;
  }

  renderPatternHeader(pattern);
  renderSteps(pattern);
  updateTopbar(pattern);
  updateBottomButtons(pattern);
  showView('pattern');
  document.getElementById('bottom-bar').classList.add('visible');

  // Scroll active step into view after transition
  setTimeout(() => scrollActiveIntoView(), 350);
}

function renderPatternHeader(pattern) {
  const header = document.getElementById('pattern-header');
  const svgKey = PATTERN_SVG_MAP[pattern.id];
  const svgBig = svgKey && HAEKEL_SVGS.productPreviews[svgKey]
    ? `<div class="pattern-svg-big">${HAEKEL_SVGS.productPreviews[svgKey]}</div>`
    : `<span class="pattern-emoji-big">${pattern.image}</span>`;

  const desc = PATTERN_DESCRIPTIONS[pattern.id];
  let descHtml = '';
  if (desc) {
    descHtml = `
    <div class="pattern-description">
      <div>${desc.description}</div>
      <div>${desc.result_description}</div>
      ${desc.special_pattern ? `<div class="special">&#x2728; ${desc.special_pattern}</div>` : ''}
      ${desc.gift_idea ? `<div class="gift">&#x1F381; ${desc.gift_idea}</div>` : ''}
    </div>`;
  }

  const stitchLegendItems = [
    { key: 'chain',      abbr: 'Lm',  name: 'Luftmasche' },
    { key: 'slip',       abbr: 'Km',  name: 'Kettmasche' },
    { key: 'sc',         abbr: 'fM',  name: 'Feste Masche' },
    { key: 'hdc',        abbr: 'hStb', name: 'Halbes Staebchen' },
    { key: 'dc',         abbr: 'Stb', name: 'Staebchen' },
    { key: 'tr',         abbr: 'dStb', name: 'Doppelstaebchen' },
    { key: 'inc',        abbr: 'Zun', name: 'Zunahme' },
    { key: 'dec',        abbr: 'Abn', name: 'Abnahme' },
    { key: 'magic_ring', abbr: 'MR',  name: 'Magic Ring' },
  ].map(s => `<div class="stitch-legend-item">${HAEKEL_SVGS.stitchSymbols[s.key]}<strong>${s.abbr}</strong> ${s.name}</div>`).join('');

  header.innerHTML = `
    <div class="pattern-emoji-title">
      ${svgBig}
      <div class="pattern-title-block">
        <h1 class="pattern-title">${pattern.title}</h1>
        <div class="pattern-subtitle">${pattern.category} · ${pattern.steps.length} Schritte</div>
      </div>
    </div>
    ${descHtml}
    <button class="stitch-legend-toggle" onclick="toggleStitchLegend(this)">&#x1F9F5; Maschensymbole anzeigen</button>
    <div class="stitch-legend" id="stitch-legend">
      <div class="stitch-legend-grid">${stitchLegendItems}</div>
    </div>
    <div class="pattern-info-row">
      <span class="info-chip">&#x2702; <strong>${pattern.hook}</strong></span>
      <span class="info-chip">&#x1F9F6; <strong>${pattern.yarn}</strong></span>
      <span class="info-chip">&#x23F1; <strong>${pattern.time}</strong></span>
      <span class="info-chip">&#x1F4AA; <strong>${pattern.difficulty}</strong></span>
    </div>
    <div class="materials-box">
      <div class="materials-label">&#x1F4CB; Material</div>
      <ul class="materials-list">
        ${pattern.materials.map(m => `<li>${m}</li>`).join('')}
      </ul>
    </div>
  `;
}

function toggleStitchLegend(btn) {
  const legend = document.getElementById('stitch-legend');
  const isOpen = legend.classList.toggle('open');
  btn.textContent = isOpen ? '\uD83E\uDDF5 Maschensymbole ausblenden' : '\uD83E\uDDF5 Maschensymbole anzeigen';
}

function annotateStitches(text) {
  // Replace known stitch abbreviations with code elements bearing title tooltips
  let result = text;
  // Sort by length desc so longer abbreviations match first
  const abbrs = Object.keys(STITCH_TITLES).sort((a, b) => b.length - a.length);
  abbrs.forEach(abbr => {
    const title = STITCH_TITLES[abbr];
    // Only match as whole words
    const re = new RegExp('\\b' + abbr.replace(/\./g, '\\.') + '\\b', 'g');
    result = result.replace(re, `<code title="${title}">${abbr}</code>`);
  });
  return result;
}

function renderSteps(pattern) {
  const list = document.getElementById('steps-list');
  const descData = PATTERN_DESCRIPTIONS[pattern.id];
  const stepIllustrations = descData && descData.step_illustrations ? descData.step_illustrations : {};

  list.innerHTML = pattern.steps.map((step, i) => {
    const state = i < currentStep ? 'done' : i === currentStep ? 'active' : 'upcoming';
    const checkIcon = state === 'done' ? '&#10003;' : state === 'active' ? String(i + 1) : '';

    let notationHtml = '';
    if (step.notation) {
      notationHtml += `<span class="step-notation">${annotateStitches(step.notation)}</span>`;
    }
    if (step.stitch_count) {
      notationHtml += `<span class="step-count">${step.stitch_count}</span>`;
    }
    if (notationHtml) notationHtml = `<div style="margin-top:6px">${notationHtml}</div>`;

    const tipHtml = step.tip
      ? `<div class="step-tip"><span class="step-tip-icon">&#x1F4A1;</span><span>${step.tip}</span></div>`
      : '';

    // Step chart SVG — shown for active and done steps
    let chartHtml = '';
    if (state !== 'upcoming') {
      const stepSvg = generateStepSVG(step, pattern.id, i);
      if (stepSvg) {
        chartHtml = `<div class="step-chart">${stepSvg}</div>`;
      }
    }

    // Legacy step illustration (kept for backward compat, shown below chart when both apply)
    let illustrationHtml = '';
    const stepNum = String(i + 1);
    if (state !== 'upcoming' && stepIllustrations[stepNum]) {
      const illustKey = stepIllustrations[stepNum];
      const svg = HAEKEL_SVGS.stepIllustrations[illustKey];
      if (svg) {
        illustrationHtml = `<div class="step-illustration">${svg}</div>`;
      }
    }

    return `<div class="step-item step-item--${state}" id="step-${i}" data-step="${i}">
      <div class="step-check">${checkIcon}</div>
      <div class="step-content">
        <div class="step-label step-label--${state}">
          <span class="step-number">Schritt ${i + 1}</span>${step.title}
        </div>
        ${chartHtml}
        ${state !== 'upcoming' ? `<div class="step-instruction">${annotateStitches(step.instruction)}</div>` : `<div class="step-title">${step.title}</div>`}
        ${state !== 'upcoming' ? notationHtml : ''}
        ${illustrationHtml}
        ${state === 'active' ? tipHtml : ''}
      </div>
    </div>`;
  }).join('');
}

function updateTopbar(pattern) {
  const total = pattern.steps.length;
  const pct = currentStep >= total ? 100 : Math.round((currentStep / total) * 100);
  document.getElementById('topbar-label').innerHTML =
    currentStep >= total
      ? '<strong>Fertig!</strong>'
      : `Schritt <strong>${currentStep + 1}</strong> / ${total}`;
  document.getElementById('topbar-fill').style.width = pct + '%';
}

function updateBottomButtons(pattern) {
  const total = pattern.steps.length;
  const confirmBtn = document.getElementById('btn-confirm');
  const backBtn = document.getElementById('btn-back-step');

  if (currentStep >= total) {
    confirmBtn.textContent = 'Fertig! \uD83C\uDF89';
    confirmBtn.disabled = false;
  } else {
    confirmBtn.textContent = `Schritt ${currentStep + 1} fertig \u2713`;
    confirmBtn.disabled = false;
  }

  backBtn.disabled = currentStep === 0;
}

function scrollActiveIntoView() {
  const active = document.querySelector('.step-item--active');
  if (active) {
    active.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function nextStep() {
  const pattern = PATTERNS.find(p => p.id === currentPatternId);
  if (!pattern) return;

  if (currentStep >= pattern.steps.length) {
    // Already done — show completion
    saveProgress(currentPatternId, pattern.steps.length);
    renderCompletion(pattern);
    showView('completion');
    document.getElementById('bottom-bar').classList.remove('visible');
    return;
  }

  currentStep++;
  saveProgress(currentPatternId, currentStep);

  if (currentStep >= pattern.steps.length) {
    // Just finished
    renderCompletion(pattern);
    showView('completion');
    document.getElementById('bottom-bar').classList.remove('visible');
    return;
  }

  renderSteps(pattern);
  updateTopbar(pattern);
  updateBottomButtons(pattern);
  setTimeout(scrollActiveIntoView, 100);
}

function prevStep() {
  if (currentStep === 0) return;
  const pattern = PATTERNS.find(p => p.id === currentPatternId);
  if (!pattern) return;

  currentStep--;
  saveProgress(currentPatternId, currentStep);
  renderSteps(pattern);
  updateTopbar(pattern);
  updateBottomButtons(pattern);
  setTimeout(scrollActiveIntoView, 100);
}

function goBack() {
  showSelector();
}

// ============ COMPLETION ============
function renderCompletion(pattern) {
  document.getElementById('completion-emoji').textContent = pattern.image;
  document.getElementById('completion-text').textContent =
    `Du hast "${pattern.title}" erfolgreich abgeschlossen. ${pattern.steps.length} Schritte gemeistert!`;
}

function restartPattern() {
  if (!currentPatternId) return;
  currentStep = 0;
  saveProgress(currentPatternId, 0);
  openPattern(currentPatternId);
}

// ============ INIT ============
renderSelector();
</script>
